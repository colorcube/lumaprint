[package]
name = "lumaprint-cms"
description = "Safe Rust facade over LittleCMS 2 (liblcms2) for LumaPrint: 16-bit ICC v2/v4 transforms, BPC, Softproofing, and Gamut Warning"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
lumaprint-color = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

name: Documentation
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: |
          zensical build --clean
          zensical build --clean -f zensical.de.toml
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=manual/"><link rel="canonical" href="manual/"><title>LumaPrint</title><a href="manual/">LumaPrint User Guide</a> · <a href="handbuch/">Benutzerhandbuch</a>\n' > site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
